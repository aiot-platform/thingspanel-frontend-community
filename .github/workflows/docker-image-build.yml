# ThingsPanel 1.2-release 分支镜像构建（frontend）
#
# 先本地构建 dist，再用仓库根 Dockerfile 打包 nginx 镜像，
# 只推送到自有阿里云 ACR（peak-aiot 命名空间）。
# 触发：推送 1.2-release 分支，或在 Actions 页面手动触发。
name: Docker Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - 1.2-release

permissions:
  contents: read

env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot
  VERSION: v1.2.12.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.17

      - name: 缓存 pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装 pnpm
        run: npm install -g pnpm@8.15.5

      - name: 安装依赖
        run: pnpm i

      - name: 构建前端产物 dist
        run: pnpm build:4096
        env:
          CI: true

      - name: 登录自有 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送到自有 ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ACR }}/thingspanel-vue:${{ env.VERSION }}
